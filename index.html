<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Nube de Wilson | v2.0 Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
    <style>
        /* =============================================
           SISTEMA DE DISEÑO — DARK LUXURY / TECH PREMIUM
        ============================================= */
        :root {
            /* Colores base */
            --bg-dark:      #080808;
            --surface-1:    #111111;
            --surface-2:    #191919;
            --border:       rgba(255,255,255,0.07);
            --border-h:     rgba(255,255,255,0.13);

            /* Acento principal — Cian eléctrico */
            --accent:       #00D4FF;
            --accent-dim:   rgba(0,212,255,0.10);
            --accent-glow:  rgba(0,212,255,0.22);

            /* Colores funcionales (mantienen lógica JS) */
            --highlight:    #00D4FF;   /* reemplaza verde lima */
            --accent-green: #8aabb0;
            --sj-gold:      #ffcc00;
            --capsula-blue: #00d4ff;
            --musica-pink:  #ff007a;
            --white-bone:   #F0F0F0;

            /* Geometría */
            --radius-card: 22px;
            --radius-btn:  16px;
            --gap:         10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            /* Grano sutil — da profundidad sin distracción */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
            color: var(--white-bone);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* =============================================
           HEADER
        ============================================= */
        header {
            background-color: var(--surface-1);
            padding: 11px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            /* Línea de acento cian muy sutil en la parte superior */
            box-shadow: inset 0 1px 0 rgba(0,212,255,0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.7rem;
            color: var(--white-bone);
            letter-spacing: 0.04em;
            cursor: pointer;
        }
        .logo span { color: var(--accent); }

        .signal-selector {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .btn-signal {
            background: none;
            border: none;
            color: #505050;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.68rem;
            font-weight: 500;
            padding: 6px 13px;
            cursor: pointer;
            border-radius: 7px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.2s, color 0.2s;
        }
        .btn-signal.active {
            background: var(--accent);
            color: #000;
            font-weight: 700;
        }

        /* LATIDO — dot de estado */
        .dot {
            width: 8px; height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            display: inline-block;
            margin-right: 7px;
            vertical-align: middle;
            box-shadow: 0 0 8px rgba(255,51,51,0.8);
            animation: pulse-fade 1.5s infinite ease-in-out;
        }
        .dot.live {
            background-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.8);
        }
        @keyframes pulse-fade {
            0%, 100% { opacity: 0.35; transform: scale(0.8); }
            50%       { opacity: 1;    transform: scale(1.2); }
        }

        /* =============================================
           VIDEO PLAYER
        ============================================= */
        .main-stage {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            max-height: 50vh;
            /* Tarjeta con bordes redondeados */
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            margin: var(--gap) auto;
            width: calc(100% - calc(var(--gap) * 2));
        }

        .player-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            display: none;
        }
        .player-frame.active { display: block; }
        video.player-frame { object-fit: cover; }

        /* =============================================
           OVERLAY "SEÑAL EN ESPERA"
        ============================================= */
        #no-signal-msg {
            position: fixed;
            /* Empieza debajo del header (~46px) para no taparlo */
            top: 46px;
            left: 0; right: 0; bottom: 0;
            background: rgba(8,8,8,0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 800;
            overflow-y: auto;
            padding: 24px env(safe-area-inset-right, 16px)
                     max(env(safe-area-inset-bottom, 20px), 24px)
                     env(safe-area-inset-left, 16px);
        }
        #no-signal-msg.visible { display: flex; }

        .no-signal-card {
            max-width: 360px;
            width: 90%;
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 36px 32px 28px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0,0,0,0.6);
            animation: fadeIn 0.35s ease;
            /* Evitar que la tarjeta quede pegada al borde */
            margin: auto;
        }

        .no-signal-close {
            position: absolute;
            top: 14px; right: 18px;
            background: none; border: none;
            color: rgba(255,255,255,0.25);
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transition: color 0.2s;
        }
        .no-signal-close:hover { color: var(--white-bone); }

        .no-signal-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .no-signal-badge .dot-red {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ff3333;
            box-shadow: 0 0 0 3px rgba(255,51,51,0.15);
            display: inline-block;
            animation: pulse-fade 1.5s infinite ease-in-out;
            flex-shrink: 0;
        }
        .no-signal-badge span {
            font-family: 'Bebas Neue', cursive;
            font-size: 0.72rem;
            color: #ff4444;
            letter-spacing: 3px;
        }

        .no-signal-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            color: var(--white-bone);
            margin: 0 0 14px;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .no-signal-body {
            font-size: 0.88rem;
            color: #606060;
            font-weight: 300;
            line-height: 1.7;
            margin: 0 0 28px;
        }

        .no-signal-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
        }
        .no-signal-hint .dot-green {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 6px #00ff88;
            display: inline-block;
            animation: pulse-fade 1.2s infinite ease-in-out;
            flex-shrink: 0;
        }
        .no-signal-hint p {
            font-size: 0.76rem;
            color: #555;
            letter-spacing: 0.06em;
            margin: 0;
        }

        /* =============================================
           TICKER — barra de mercados
        ============================================= */
        .ticker-wrap {
            background: transparent;
            overflow: hidden;
            padding: 5px var(--gap);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ticker {
            display: flex;
            align-items: center;
            position: relative;
            height: 20px;
            flex: 1;
            overflow: hidden;
        }
        .ticker-group {
            position: absolute;
            display: flex;
            align-items: center;
            white-space: nowrap;
            color: var(--accent);
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
        }
        .ticker-group-sep {
            color: rgba(0,212,255,0.25);
            margin: 0 10px;
        }
        .ticker-group.tk-entering {
            animation: tk-enter 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .ticker-group.tk-visible {
            opacity: 1; transform: translateX(0); filter: blur(0);
        }
        .ticker-group.tk-exiting {
            animation: tk-exit 1.17s ease-in forwards;
        }
        @keyframes tk-enter {
            from { opacity: 0; transform: translateX(50px); filter: blur(10px); }
            to   { opacity: 1; transform: translateX(0);    filter: blur(0);    }
        }
        @keyframes tk-exit {
            from { opacity: 1; transform: translateX(0);     filter: blur(0);    }
            to   { opacity: 0; transform: translateX(-50px); filter: blur(10px); }
        }
        

        .ticker-loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 0.72rem;
            font-weight: 500;
            padding-left: 4px;
            letter-spacing: 0.08em;
        }
        .ticker-spinner {
            width: 7px; height: 7px;
            border: 1.5px solid #2a2a2a;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }


        /* =============================================
           GRID DE SECCIONES
        ============================================= */
        .grid-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--gap);
            padding: 7px var(--gap);
            background: transparent;
        }

        .filter-card {
            background: var(--surface-1);
            padding: 15px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--border);
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .filter-card:hover { border-color: var(--accent); background: var(--accent-dim); }
        .filter-card h3 { font-family: 'Bebas Neue'; margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

        /* =============================================
           BARRA DE 5 BOTONES
        ============================================= */
        .feed-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: var(--gap);
            padding: 0 var(--gap) var(--gap);
            background: transparent;
        }

        /* BASE — efecto pulsador físico 3D con luz lateral */
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: linear-gradient(170deg, #1a1a1a 0%, #111111 60%, #0d0d0d 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-card);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.2s;
            flex: 1;
            min-width: 0;
            padding: 12px 6px;
            font-family: 'DM Sans', sans-serif;
            position: relative;
            /* Sombra inferior = profundidad del botón físico */
            box-shadow:
                0 4px 0 0 rgba(0,0,0,0.6),
                0 6px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.05),
                inset 0 -1px 0 rgba(0,0,0,0.3);
        }

        /* Al presionar: se hunde */
        .nav-btn:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(0,0,0,0.6),
                0 2px 4px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(0,0,0,0.2),
                inset 0 2px 6px rgba(0,0,0,0.3);
        }

        .nav-btn .nb-emoji { font-size: 1.4rem; line-height: 1; }
        .nav-btn .nb-label {
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #555;
            white-space: nowrap;
        }

        /* FEED — cian */
        #btn-feed-main {
            flex: 1.6;
            border-color: rgba(0,212,255,0.15);
            box-shadow:
                0 4px 0 0 rgba(0,80,100,0.7),
                0 6px 16px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(0,212,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                /* luz lateral izquierda */
                -3px 0 12px -2px rgba(0,212,255,0.20),
                /* luz lateral derecha */
                3px 0 12px -2px rgba(0,212,255,0.20);
        }
        #btn-feed-main .nb-label { color: var(--accent); }
        #btn-feed-main:hover {
            background: linear-gradient(170deg, #1c2a2e 0%, #111111 60%, #0d0d0d 100%);
            border-color: rgba(0,212,255,0.40);
            box-shadow:
                0 4px 0 0 rgba(0,80,100,0.7),
                0 8px 24px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(0,212,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 18px -1px rgba(0,212,255,0.40),
                4px 0 18px -1px rgba(0,212,255,0.40),
                0 0 28px -4px rgba(0,212,255,0.25);
            transform: translateY(-1px);
        }
        #btn-feed-main:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(0,80,100,0.7),
                0 2px 6px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(0,0,0,0.3),
                -2px 0 8px -2px rgba(0,212,255,0.20),
                2px 0 8px -2px rgba(0,212,255,0.20);
        }

        /* CLIMA — amarillo */
        #btn-clima {
            border-color: rgba(255,200,40,0.10);
            box-shadow:
                0 4px 0 0 rgba(80,60,0,0.7),
                0 6px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,200,40,0.05),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -3px 0 10px -3px rgba(255,200,40,0.12),
                3px 0 10px -3px rgba(255,200,40,0.12);
        }
        #btn-clima .nb-label { color: #444; }
        #btn-clima.local-active .nb-label { color: #ffaa00; }
        #btn-clima.local-active { border-color: rgba(255,160,0,0.4); }
        #btn-clima:hover {
            background: linear-gradient(170deg, #1e1c10 0%, #111111 60%, #0d0d0d 100%);
            border-color: rgba(255,200,40,0.40);
            box-shadow:
                0 4px 0 0 rgba(80,60,0,0.7),
                0 8px 20px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,200,40,0.10),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 16px -1px rgba(255,200,40,0.38),
                4px 0 16px -1px rgba(255,200,40,0.38),
                0 0 24px -4px rgba(255,200,40,0.20);
            transform: translateY(-1px);
        }
        #btn-clima:hover .nb-label { color: #ffcc28; }
        #btn-clima:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(80,60,0,0.7),
                0 2px 4px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(0,0,0,0.3),
                -2px 0 8px -3px rgba(255,200,40,0.18),
                2px 0 8px -3px rgba(255,200,40,0.18);
        }

        /* VIBRAS — cian tenue */
        #btn-vibras {
            border-color: rgba(0,212,255,0.07);
            box-shadow:
                0 4px 0 0 rgba(0,60,80,0.6),
                0 6px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(0,212,255,0.04),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -3px 0 10px -3px rgba(0,212,255,0.10),
                3px 0 10px -3px rgba(0,212,255,0.10);
        }
        #btn-vibras .nb-label { color: #444; }
        #btn-vibras:hover {
            background: linear-gradient(170deg, #131a1e 0%, #111111 60%, #0d0d0d 100%);
            border-color: rgba(0,212,255,0.38);
            box-shadow:
                0 4px 0 0 rgba(0,60,80,0.6),
                0 8px 20px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(0,212,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 16px -1px rgba(0,212,255,0.32),
                4px 0 16px -1px rgba(0,212,255,0.32),
                0 0 22px -4px rgba(0,212,255,0.18);
            transform: translateY(-1px);
        }
        #btn-vibras:hover .nb-label { color: var(--accent); }
        #btn-vibras:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(0,60,80,0.6),
                0 2px 4px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(0,0,0,0.3),
                -2px 0 8px -3px rgba(0,212,255,0.14),
                2px 0 8px -3px rgba(0,212,255,0.14);
        }

        /* STREAM — rojo / verde si live */
        #btn-stream {
            border-color: rgba(255,51,51,0.10);
            box-shadow:
                0 4px 0 0 rgba(80,0,0,0.6),
                0 6px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,51,51,0.04),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -3px 0 10px -3px rgba(255,51,51,0.12),
                3px 0 10px -3px rgba(255,51,51,0.12);
        }
        #btn-stream .nb-label { color: #444; }
        #btn-stream:hover {
            background: linear-gradient(170deg, #1e1010 0%, #111111 60%, #0d0d0d 100%);
            border-color: rgba(255,51,51,0.45);
            box-shadow:
                0 4px 0 0 rgba(80,0,0,0.6),
                0 8px 20px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,51,51,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 16px -1px rgba(255,51,51,0.38),
                4px 0 16px -1px rgba(255,51,51,0.38),
                0 0 22px -4px rgba(255,51,51,0.20);
            transform: translateY(-1px);
        }
        #btn-stream:hover .nb-label { color: #ff4444; }
        #btn-stream:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(80,0,0,0.6),
                0 2px 4px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(0,0,0,0.3),
                -2px 0 8px -3px rgba(255,51,51,0.16),
                2px 0 8px -3px rgba(255,51,51,0.16);
        }
        #btn-stream.live-on {
            border-color: rgba(0,255,136,0.25);
            background: linear-gradient(170deg, #101e14 0%, #111111 60%, #0d0d0d 100%);
            box-shadow:
                0 4px 0 0 rgba(0,80,40,0.7),
                0 6px 16px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(0,255,136,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 16px -1px rgba(0,255,136,0.35),
                4px 0 16px -1px rgba(0,255,136,0.35),
                0 0 22px -4px rgba(0,255,136,0.18);
        }
        #btn-stream.live-on .nb-label { color: #00ff88; }

        /* RADIO — naranja ámbar */
        #btn-radio-modal {
            border-color: rgba(200,120,0,0.12);
            box-shadow:
                0 4px 0 0 rgba(70,35,0,0.7),
                0 6px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(200,120,0,0.05),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -3px 0 10px -3px rgba(200,120,0,0.15),
                3px 0 10px -3px rgba(200,120,0,0.15);
        }
        #btn-radio-modal .nb-emoji { color: #cc7700; }
        #btn-radio-modal .nb-label { color: #444; }
        #btn-radio-modal:hover {
            background: linear-gradient(170deg, #1c1508 0%, #111111 60%, #0d0d0d 100%);
            border-color: rgba(200,120,0,0.45);
            box-shadow:
                0 4px 0 0 rgba(70,35,0,0.7),
                0 8px 20px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(200,120,0,0.10),
                inset 0 -1px 0 rgba(0,0,0,0.3),
                -4px 0 16px -1px rgba(200,120,0,0.40),
                4px 0 16px -1px rgba(200,120,0,0.40),
                0 0 24px -4px rgba(200,120,0,0.22);
            transform: translateY(-1px);
        }
        #btn-radio-modal:hover .nb-label { color: #cc7700; }
        #btn-radio-modal:active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 0 rgba(70,35,0,0.7),
                0 2px 4px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(0,0,0,0.3),
                -2px 0 8px -3px rgba(200,120,0,0.18),
                2px 0 8px -3px rgba(200,120,0,0.18);
        }
        #btn-radio-modal.radio-active {
            border-color: rgba(200,120,0,0.40);
            background: linear-gradient(170deg, #1c1508 0%, #111111 60%, #0d0d0d 100%);
            animation: radio-pulse 2s infinite ease-in-out;
        }
        #btn-radio-modal.radio-active .nb-label { color: #e08800; }
        @keyframes radio-pulse {
            0%, 100% {
                box-shadow:
                    0 4px 0 0 rgba(70,35,0,0.7),
                    0 6px 12px rgba(0,0,0,0.4),
                    inset 0 1px 0 rgba(200,120,0,0.06),

        /* =============================================
           MODAL CLIMA
        ============================================= */
        #clima-modal {
            position: fixed; inset: 0;
            background: rgba(8,8,8,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 900;

        .clima-card {
            width: 92%; max-width: 420px;

            border: 1px solid var(--border);
            border-radius: var(--radius-card);

            animation: fadeIn 0.3s ease;

        .clima-close {
            position: absolute; top: 14px; right: 18px;

            cursor: pointer; line-height: 1; padding: 0;
            transition: color 0.2s;
        }
        .clima-close:hover { color: var(--white-bone); }

        .clima-header {
            font-family: 'Bebas Neue', cursive;
            font-size: 0.72rem; letter-spacing: 3px;
            color: #ffcc28; margin-bottom: 18px;

        }
        .clima-city {
            font-family: 'Bebas Neue', cursive;

        }
        .clima-temp {
            font-family: 'Bebas Neue', cursive;
            font-size: 4rem; color: var(--white-bone);

        .clima-desc {
            font-size: 0.9rem; color: #666; font-weight: 300;

        }
        .clima-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-top: 16px;
        }
        .clima-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 14px;
        }
        .clima-item-label {
            font-size: 0.62rem; color: #444; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px;
        }
        .clima-item-val {

        .clima-spinner {
            width: 18px; height: 18px;

        /* BOTÓN PLAY/PAUSA CUSTOM */
        #btn-yt-control {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 40px; height: 40px;
            background: rgba(8,8,8,0.75);
            border: 1px solid rgba(0,212,255,0.4);

        #btn-yt-control:hover {
            background: var(--accent-dim);

        }

        /* =============================================
           SPONSORS — sistema mejorado
        ============================================= */
        .sponsor-footer {
            padding: 5px var(--gap);
            text-align: center;
            border-top: 1px solid var(--border);
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #sponsor-ad {
            max-width: 90%;
            height: 120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Barra de progreso del sponsor */
        #sponsor-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 2px;
            background: var(--accent);
            width: 0%;
            transition: width linear;
            opacity: 0.6;
            border-radius: 0 2px 2px 0;

        #sponsor-ad img,

            width: 100%; height: 100%;

        }
        .sponsor-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .sponsor-placeholder-bar {
            height: 3px; width: 60px;
            background: linear-gradient(90deg, var(--surface-1), var(--surface-2), var(--surface-1));
            background-size: 200% 100%;
            border-radius: 2px;
            animation: shimmer 1.5s infinite;
        }
        .sponsor-placeholder-bar:nth-child(2) { width: 40px; animation-delay: 0.2s; }
        .sponsor-placeholder-bar:nth-child(3) { width: 50px; animation-delay: 0.4s; }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }

        /* =============================================
           TIMELINE OVERLAY
        ============================================= */
        #timeline-overlay {
            position: fixed;
            top: 0; right: -100%;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 500;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);

            padding: 0 0 40px 0;

            flex-direction: column;
        }
        #timeline-overlay .timeline-container {
            padding: 0 5% 40px;
        }
        #timeline-overlay.open { right: 0; }

        /* =============================================
           FEED LOCAL OVERLAY
        ============================================= */
        #feed-local-overlay {
            position: fixed;
            top: 0; right: -100%;
            width: 100%; height: 100%;
            background: rgba(8,8,8,0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 500;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            overflow-y: auto;
            padding: 0 0 40px 0;
            display: flex;
            flex-direction: column;
        }
        #feed-local-overlay.open { right: 0; }

            border-left-color: rgba(255,160,0,0.25);
        }

        #feed-local-overlay .note-card {
            border-left-color: #ffaa00;
        }
        #feed-local-overlay .note-card::before {
            border-color: #ffaa00;
        }

        #feed-local-header {
            font-family: 'Bebas Neue', cursive;

            color: #ffaa00;
            text-align: center;
            padding: 24px 5% 0;
            flex-shrink: 0;
        }
        #feed-local-header span {
            font-size: 0.72rem;
            color: #555;
            display: block;
            letter-spacing: 2px;
            margin-top: 2px;
            font-family: sans-serif;
            text-transform: uppercase;
        }

        .close-timeline {
            position: sticky;
            top: 52px;
            margin-left: auto; margin-right: 5%;
            display: table;
            font-size: 2rem;
            color: var(--accent);
            cursor: pointer;
            z-index: 600;
            background: rgba(8,8,8,0.8);
            width: 44px; height: 44px;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(0,212,255,0.25);

            transition: all 0.2s;
            flex-shrink: 0;
            align-self: flex-end;
            margin-top: 10px;

        .close-timeline:hover { transform: scale(1.1); background: var(--accent-dim); }

        .timeline-container {
            max-width: 700px;
            margin: 20px auto 0;
            border-left: 2px solid rgba(0,212,255,0.2);
            padding-left: 30px;

        }

        .note-card {
            background: var(--surface-1);
            border-radius: var(--radius-btn);
            padding: 20px;
            margin-bottom: 40px;

            transition: all 0.3s ease;
        }
        .note-card::before {
            content: '';
            position: absolute;
            left: -41px; top: 25px;
            width: 14px; height: 14px;
            background: var(--bg-dark);
            border: 2px solid var(--accent);
            border-radius: 50%;
        }

        .cat-data       { border-left-color: var(--accent); }
        .cat-senalsj    { border-left-color: var(--sj-gold); }
        .cat-capsula    { border-left-color: var(--capsula-blue); }
        .cat-musica     { border-left-color: var(--musica-pink); }
        .cat-sanjuan    { border-left: 4px solid #ffcc00; }
        .cat-tecnologia { border-left: 4px solid #00ffff; }
        .cat-ciencia    { border-left: 4px solid #00ff88; }
        .cat-juegos     { border-left: 4px solid #ffffff; }

        .note-img {
            width: auto; max-width: 80%; max-height: 350px;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            display: block; object-fit: contain;
        }
        .note-title {
            font-family: 'Bebas Neue';
            font-size: 1.9rem;
            margin: 0 0 10px 0;
            color: var(--white-bone);
            line-height: 1;
        }
        .note-content {
            font-size: 0.95rem;
            line-height: 1.65;
            color: #666;
            font-weight: 300;
        }

        .share-bar {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .share-btn {
            background: none; border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.06em;
        }

        /* =============================================
           TOAST
        ============================================= */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent);
            color: #000;
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* =============================================
           SIDEBAR DE VIBRAS
        ============================================= */
        #vibe-sidebar {
            position: fixed;
            top: 0; right: -40%;
            width: 33.33%;
            height: 100%;
            background: rgba(8,8,8,0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            transition: 0.5s cubic-bezier(0.7, 0, 0.3, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }
        #vibe-sidebar.open { right: 0; }

        .vibe-header {
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            color: var(--accent);
            padding: 80px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.06em;
        }

        .vibe-container {
            flex-grow: 1; overflow-y: auto;
            padding: 16px;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .vibe-container::-webkit-scrollbar { display: none; }

        .vibe-item {
            padding: 13px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            border-radius: 10px;

            display: flex;

            gap: 10px;

        .vibe-item.active-vibe {

        .vibe-item.active-vibe::after {
            content: '🔊';

            font-size: 0.9rem;
            animation: pulse-fade 1.5s infinite ease-in-out;
        }

        .vibe-sidebar-close {
            position: absolute;
            top: 50%; left: -40px;
            transform: translateY(-50%);

            background: rgba(8,8,8,0.9);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: var(--accent);

            display: flex; align-items: center; justify-content: center;
            z-index: 1001;

        }
        .vibe-sidebar-close:hover { background: var(--accent-dim); color: #fff; }

        /* =============================================
           RANKINGS MODAL
        ============================================= */

        .note-read-more {
            margin-top: 10px;
            background: none; border: none;
            color: var(--accent);
            font-size: 0.76rem; font-weight: 500;
            cursor: pointer; padding: 0;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 4px;

        .note-extra-content {

        .note-extra-content.expanded { max-height: 2000px; }

        .ranking-trend {
            font-size: 0.68rem; font-weight: 600;

        .trend-same { color: #2a2a2a; }
        .trend-down { color: rgba(255,80,80,0.4); }

        /* =============================================
           SIDEBAR DE RADIO
        ============================================= */
        #radio-sidebar {
            position: fixed;
            top: 0; right: -40%;
            width: 33.33%; height: 100%;
            background: rgba(8,8,8,0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            transition: 0.5s cubic-bezier(0.7, 0, 0.3, 1);
            display: flex; flex-direction: column;
            border-left: 1px solid rgba(200,120,0,0.18);
        }
        #radio-sidebar.open { right: 0; }

        .radio-header {
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            color: #cc7700;
            padding: 80px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(200,120,0,0.12);
            letter-spacing: 0.06em;
        }
        .radio-header small {
            display: block;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.67rem;
            color: rgba(180,100,0,0.45);
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .radio-container {
            flex-grow: 1; overflow-y: auto; padding: 14px;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .radio-container::-webkit-scrollbar { display: none; }

        .radio-item {
            padding: 11px 10px; margin-bottom: 5px;
            cursor: pointer; border-radius: 9px;
            transition: 0.2s;
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
        }
        .radio-item:hover { background: rgba(180,90,0,0.1); border-color: rgba(200,120,0,0.2); }
        .radio-item .radio-dot {
            width: 3px; height: 18px; border-radius: 2px;
            flex-shrink: 0; background: #cc7700; opacity: 0.5;
        }
        .radio-item span.radio-name {
            font-family: 'Bebas Neue';
            font-size: 0.95rem; color: #888;
            letter-spacing: 1px; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .radio-item.active-radio {
            background: rgba(180,90,0,0.12) !important;
            border-color: rgba(200,120,0,0.3) !important;
        }
        .radio-item.active-radio span.radio-name { color: #cc7700; }
        .radio-item.connecting {
            background: rgba(0,212,255,0.05) !important;
            border-color: rgba(0,212,255,0.2) !important;
        }
        .radio-item.connecting span.radio-name { color: rgba(0,212,255,0.7); }
        .radio-item.connecting .radio-dot {
            background: var(--accent);
            opacity: 1;
            animation: pulse-fade 0.7s infinite ease-in-out;
        }
        .radio-item.connecting .radio-speaker {
            opacity: 0;
        }
        .radio-item.connecting::after {
            content: '···';
            font-size: 1rem;
            color: var(--accent);
            letter-spacing: 2px;
            animation: connectingDots 1.2s steps(4, end) infinite;
            flex-shrink: 0;
        }
        @keyframes connectingDots {
            0%   { content: '·  '; }
            33%  { content: '·· '; }
            66%  { content: '···'; }
            100% { content: '   '; }
        }
        .radio-item .radio-speaker {
            font-size: 0.9rem; opacity: 0; transition: opacity 0.3s;
            animation: pulse-fade 1.5s infinite ease-in-out; flex-shrink: 0;
        }
        .radio-item.active-radio .radio-speaker { opacity: 1; }

        .radio-sidebar-close {
            position: absolute;
            top: 50%; left: -40px;
            transform: translateY(-50%);
            width: 40px; height: 60px;
            background: rgba(8,8,8,0.9);
            border: 1px solid rgba(200,120,0,0.2);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #cc7700;
            font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1001; transition: all 0.2s;

            color: #333;

            max-height: 0;
            overflow: hidden;
            transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1);

            border: 1px solid rgba(200,120,0,0.10);
            border-top: none;
            border-bottom-left-radius: 9px;
            border-bottom-right-radius: 9px;
        }
        .radio-accordion-body.open {
            max-height: 2000px;
        }

        .radio-accordion-body .radio-item {
            border-radius: 0;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.025);
            margin-bottom: 0;
        }
        .radio-accordion-body .radio-item:last-child {
            border-bottom: none;
        }

        /* =============================================
           RESPONSIVE
        ============================================= */
        @media (max-width: 768px) {
            .timeline-container { margin-left: 20px; }
            .note-title { font-size: 1.6rem; }
            #vibe-sidebar  { width: 80%; right: -85%; }
            #vibe-sidebar.open { right: 0; }
            .vibe-sidebar-close { width: 35px; height: 50px; left: -35px; font-size: 1rem; }
            #radio-sidebar { width: 80%; right: -85%; }
            #radio-sidebar.open { right: 0; }
            .radio-sidebar-close { width: 35px; height: 50px; left: -35px; font-size: 1rem; }
            .nav-btn .nb-emoji { font-size: 1.2rem; }
            .nav-btn .nb-label { font-size: 0.5rem; }
        }

        /* =============================================
           ANIMACIÓN DE ENTRADA
        ============================================= */
        header       { animation: fadeUp 0.35s ease both; }
        .main-stage  { animation: fadeUp 0.35s 0.07s ease both; }
        .feed-row    { animation: fadeUp 0.35s 0.12s ease both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =============================================
           BARRA DE INFO EN EL FEED (ticker + clima)
        ============================================= */
        #feed-info-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8,8,8,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Fila ticker dentro del feed */
        #feed-ticker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            height: 28px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            overflow: hidden;
        }
        #feed-ticker-row .ticker {
            height: 18px;
        }
        #feed-ticker-loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2a2a2a;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.08em;
        }

        /* Fila clima dentro del feed */
        #feed-clima-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 14px;
            height: 24px;
            overflow: hidden;
        }
        #feed-clima-text {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(255,204,0,0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #feed-clima-dot {
            width: 5px; height: 5px;
            background: #ffcc00;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-fade 2s ease-in-out infinite;
            display: none;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
